<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eastwood Tuning Checker</title>
<style>
:root{
  --bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#d9d9d4;--accent:#2d5d8a;
  --g:#1f7a3a;--g-bg:#e2f3e6;--y:#8a6100;--y-bg:#fff2cc;--r:#a3261d;--r-bg:#fbe0dd;
  --widen:#b45309;--widen-bg:#fde7d1;--loose:#6d28d9;--loose-bg:#ede4fd;--hl:#ffd54a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18181a;--panel:#232326;--ink:#ececea;--muted:#a0a09a;--line:#3a3a3e;--accent:#7fb0e0;
  --g:#7fd69a;--g-bg:#1e3a27;--y:#f0c860;--y-bg:#3d3216;--r:#ff9b91;--r-bg:#46201d;
  --widen:#fbb36b;--widen-bg:#46301a;--loose:#c4a8ff;--loose-bg:#32264a;--hl:#a8861a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
#instInput{width:100%;max-width:640px}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{font-size:12px;color:var(--muted)}
.strings{display:grid;gap:6px;margin:0 0 10px}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srow .lbl{width:200px;font-size:14px}
.srow .lbl small{color:var(--muted);display:block;font-size:12px}
.note{width:70px;text-align:center;font-weight:700}
.note:focus{outline:3px solid var(--sc);outline-offset:2px;border-color:var(--sc)}
.wk.on,.bk.on{border-color:#000}
.bk.on.dark{box-shadow:inset 0 0 0 3px #fff}
.wk.on span.light{color:#fff}
.note.bad{border-color:var(--r);background:var(--r-bg)}
/* piano */
#pianoWrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#222;padding:6px 6px 2px}
#piano{position:relative;height:120px}
.wk,.bk{position:absolute;top:0;cursor:pointer;border-radius:0 0 4px 4px;user-select:none}
.wk{width:24px;height:118px;background:#fafaf7;border:1px solid #888;z-index:1}
.bk{width:15px;height:72px;background:#1b1b1b;z-index:2;border:1px solid #000}
.wk span{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:#555;line-height:1}
.wk span.c{font-weight:800;color:#222}
.wk:hover{background:#e6eefa}.bk:hover{background:#445}
/* results */
.verdict{padding:12px 14px;border-radius:7px;font-size:18px;font-weight:700;margin-bottom:10px}
.verdict.green{background:var(--g-bg);color:var(--g)}
.verdict.yellow{background:var(--y-bg);color:var(--y)}
.verdict.red{background:var(--r-bg);color:var(--r)}
.verdict small{display:block;font-size:13px;font-weight:400;color:var(--ink);margin-top:3px}
.gauges{font-size:20px;font-weight:800;margin:4px 0 2px;line-height:1.8}
.gauges .gc{padding:1px 5px;border-radius:4px}
.gauges .gc.widen{background:var(--widen-bg);color:var(--widen)}
.gauges .gc.loose{background:var(--loose-bg);color:var(--loose)}
.gauges .sep{color:var(--muted);font-weight:400;margin:0 4px}
.check{border-left:4px solid var(--y);padding:8px 12px;background:var(--y-bg);margin:10px 0;border-radius:4px;font-size:14px}
.check ul{margin:0 0 0 18px;padding:0}
.confirmed{border-left:4px solid var(--g);padding:8px 12px;background:var(--g-bg);margin:8px 0;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
.g{color:var(--g);font-weight:700}.y{color:var(--y);font-weight:700}
a.link{color:var(--accent);cursor:pointer;text-decoration:underline}
.hidden{display:none}
@media (max-width:640px){.srow .lbl{width:100%}}
</style>
</head>
<body>
<main>

  <section class="panel">
    <h2>1. Instrument</h2>
    <input type="text" id="instInput" list="instList" placeholder="Start typing a model name (e.g. Ezra, Mandocello, Tenor)…" autocomplete="off">
    <datalist id="instList"></datalist>
  </section>

  <section class="panel hidden" id="tuningPanel">
    <h2>2. Tuning</h2>
    <div class="strings" id="stringRows"></div>
    <div class="row">
      <button id="btnStock">Fill with stock tuning</button>
      <button id="btnClear">Clear</button>
      <label class="mini"><input type="checkbox" id="chkSound" checked> sound</label>
    </div>
    <div id="pianoWrap" style="margin-top:10px"><div id="piano"></div></div>
  </section>

  <section class="panel hidden" id="resultPanel">
    <h2>3. Result</h2>
    <div id="result"></div>
  </section>

  <section class="panel hidden" id="altPanel">
    <h2>Other instruments for this tuning</h2>
    <div id="alts"></div>
  </section>
</main>

<script>
// Eastwood tuning feasibility engine.
// Pure functions only: no DOM. Runs in the browser and in Node (for tests).
//
// Physics: T = UW * (2 * L * F)^2 / 386.4
//   T  = tension (lb), UW = unit weight (lb/in), L = scale length (in), F = frequency (Hz)

(function (root) {
'use strict';

// ---------------------------------------------------------------------------
// Default settings (all editable in the tool's Settings panel)
// ---------------------------------------------------------------------------
const DEFAULT_SETTINGS = {
  // Per-string tension windows (lb) by family. Each instrument class's own
  // stock range is merged into the green band automatically (see classWindow).
  windows: {
    electric: { yellowLo: 8,  greenLo: 11, greenHi: 26, yellowHi: 35 },
    acoustic: { yellowLo: 10, greenLo: 13, greenHi: 30, yellowHi: 35 },
    bass:     { yellowLo: 22, greenLo: 27, greenHi: 55, yellowHi: 65 },
  },
  // Total tension compared with the instrument's own stock total (ratio).
  total: {
    electric: { green: 1.10, yellow: 1.25 },
    acoustic: { green: 1.05, yellow: 1.15 },
    bass:     { green: 1.10, yellow: 1.25 },
  },
  // Plain-steel breaking limit, as frequency (Hz) x scale length (in).
  // Gauge does not matter for this. Green up to the highest value Eastwood
  // already ships or has confirmed (computed from data at load; this is a floor).
  breakGreen: 10250,
  breakYellow: 10800,
  maxWoundNonBass: 0.064,   // "nothing heavier than 64w on a non-bass instrument"
  maxWoundBass: 0.145,
  maxPlain: 0.026,
  // Above these plain gauges, a wound string is suggested first (plain shown as alt).
  plainPreferMax: { electric: 0.020, acoustic: 0.018, bass: 0 },
  minWound: 0.017,
  allowHalfGauges: false,   // .0095, .0105, .0135 etc. Off = whole gauges only.
  // Stock strings above these tensions are treated as probable spec errors:
  // reported in the Data Check panel and left out of the class ranges.
  sanityMax: { electric: 30, acoustic: 32, bass: 70 },
  // Nut-slot flags: compare suggested gauge to stock gauge in the same slot.
  nutWiden: 0.003,          // suggested bigger by this much or more -> slot needs widening
  nutLoose: 0.006,          // suggested smaller by this much or more -> slot may be loose
};

// ---------------------------------------------------------------------------
// Available D'Addario single gauges (from daddario.com singles listings, Nov 2026)
// ---------------------------------------------------------------------------
const AVAILABLE = {
  PL: [.007,.008,.0085,.009,.0095,.010,.0105,.011,.0115,.012,.0125,.013,.0135,.014,.015,.0155,.016,.0165,.017,.018,.019,.020,.021,.022,.024,.026],
  NW: [.017,.018,.019,.020,.021,.022,.023,.024,.025,.026,.028,.030,.032,.034,.036,.037,.038,.039,.040,.042,.044,.046,.048,.049,.050,.052,.054,.056,.059,.060,.062,.064,.065,.066,.068,.070,.072,.074,.080,.090],
  PB: [.017,.020,.021,.022,.023,.024,.025,.026,.027,.028,.029,.030,.032,.034,.035,.036,.038,.039,.040,.042,.044,.045,.046,.047,.048,.049,.050,.052,.053,.054,.056,.058,.059,.060,.062,.064,.066,.068,.070,.076],
  XLB: [.018,.020,.025,.028,.032,.035,.040,.042,.045,.050,.052,.055,.060,.065,.067,.070,.075,.080,.085,.090,.095,.100,.105,.107,.110,.120,.125,.130,.135,.145],
};

// Plain steel unit weight = k * d^2 (matches D'Addario PL data within 0.3%)
const PLAIN_K = 0.22156;

// Measured wound unit weights, injected from data (D'Addario published tensions).
let UW_TABLE = null;
function setUnitWeights(tbl) {
  UW_TABLE = {};
  for (const fam of Object.keys(tbl)) {
    UW_TABLE[fam] = Object.entries(tbl[fam])
      .map(([d, uw]) => ({ d: +d, k: uw / (+d * +d) }))
      .sort((a, b) => a.d - b.d);
  }
}

// Interpolate k = UW/d^2 linearly between measured gauges (very smooth in practice).
function woundUW(material, d) {
  const pts = UW_TABLE[material];
  if (!pts || !pts.length) throw new Error('No unit weight data for ' + material);
  let k;
  if (d <= pts[0].d) k = pts[0].k;
  else if (d >= pts[pts.length - 1].d) k = pts[pts.length - 1].k;
  else {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if (d >= a.d && d <= b.d) { k = a.k + (b.k - a.k) * (d - a.d) / (b.d - a.d); break; }
    }
  }
  return k * d * d;
}

function isMeasured(material, d) {
  return !!(UW_TABLE[material] || []).find(p => Math.abs(p.d - d) < 1e-6);
}

// ---------------------------------------------------------------------------
// Notes
// ---------------------------------------------------------------------------
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_RE = /([A-Ga-g])\s*(#|b|♯|♭)?\s*(\d)/g;

function noteToMidi(name) {
  const m = /^([A-Ga-g])(#|b|♯|♭)?(\d)$/.exec(name.trim());
  if (!m) return null;
  let s = NOTE_BASE[m[1].toUpperCase()];
  if (m[2] === '#' || m[2] === '♯') s += 1;
  if (m[2] === 'b' || m[2] === '♭') s -= 1;
  return s + 12 * (+m[3] + 1);
}
function midiToName(midi, flats) {
  return (flats ? FLAT_NAMES : SHARP_NAMES)[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}
function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
function parseNotes(str) {
  const out = []; let m; NOTE_RE.lastIndex = 0;
  while ((m = NOTE_RE.exec(str))) out.push(noteToMidi(m[1].toUpperCase() + (m[2] || '') + m[3]));
  return out;
}

// ---------------------------------------------------------------------------
// Gauges
// ---------------------------------------------------------------------------
// "42w" -> {d:.042, wound:true}; "11" -> {d:.011, wound:false}; "9.5" -> .0095;
// ".040" / "0.40" (customer shorthand) -> .040; "20p" -> plain; stray "s" treated as wound.
function parseGauge(tok, forceWound) {
  let t = String(tok).trim().toLowerCase();
  if (!t) return null;
  const m = /^(\d*\.?\d+)\s*([a-z]*)$/.exec(t);
  if (!m) return null;
  let num = m[1], suf = m[2];
  let d;
  if (num.startsWith('0.') || num.startsWith('.')) {
    d = parseFloat(num);
    if (d > 0.2) d = d / 10;          // "0.40" meaning .040
  } else d = parseFloat(num) / 1000;   // "42", "9.5", "105"
  let wound;
  if (suf.startsWith('p')) wound = false;
  else if (suf.startsWith('w') || suf.startsWith('s')) wound = true;
  else wound = !!forceWound || d > 0.026;
  return { d: Math.round(d * 100000) / 100000, wound };
}
function fmtGauge(g) {
  if (!g) return '?';
  let n = g.d * 1000;
  let s = Math.abs(n - Math.round(n)) < 1e-6 ? String(Math.round(n)) : String(Math.round(n * 10) / 10);
  return s + (g.wound ? 'w' : '');
}

// ---------------------------------------------------------------------------
// Instruments
// ---------------------------------------------------------------------------
function parseScale(s) {
  if (!s) return null;
  const t = s.replace(/in|"/g, '').trim().split(/\s+/);
  if (!t[0] || isNaN(parseFloat(t[0]))) return null;
  let v = parseFloat(t[0]);
  if (t[1] && /\d+\/\d+/.test(t[1])) { const [a, b] = t[1].split('/'); v += a / b; }
  return v;
}

function familyOf(inst) {
  if (inst.cls === 'Bass' || inst.cls === 'Bass VI') return 'bass';
  if (/ezra/i.test(inst.name) || /ezra/i.test(inst.series)) return 'acoustic';
  return 'electric';
}
// Wound string material for a family/gauge.
function woundMaterial(family, cls, d) {
  if (family === 'acoustic') return 'PB';
  if (cls === 'Bass') return 'XLB';
  if (cls === 'Bass VI') return d > 0.080 ? 'XLB' : 'NW';
  return 'NW';
}

function unitWeight(g, inst) {
  if (!g.wound) return PLAIN_K * g.d * g.d;
  return woundUW(woundMaterial(inst.family, inst.cls, g.d), g.d);
}
function tension(g, inst, midi, scale) {
  const f = midiToFreq(midi), L = scale || inst.scale;
  return unitWeight(g, inst) * Math.pow(2 * L * f, 2) / 386.4;
}

// Pair notes with gauges inside a course: thinner string always takes the higher pitch.
function pairCourse(midis, gauges) {
  const n = [...midis].sort((a, b) => b - a);
  const g = [...gauges].sort((a, b) => a.d - b.d);
  return n.map((m, i) => ({ midi: m, gauge: g[i] || null }));
}

// Split a tuning like "C3C2-G3G2-D3D3-A3A3" or "G3/G2 C4/C3 E4/E3 A3/A3" into courses.
function parseTuning(str) {
  const parts = str.split(/[-,;\s]+/).filter(Boolean);
  return parts.map(p => parseNotes(p)).filter(c => c.length);
}

// Parse a CSV string (handles quotes, embedded commas, "" escapes).
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function baseName(name) { return name.replace(/\s*-\s*Left-Handed\s*$/i, '').trim(); }

function parseSpecs(text) {
  const rows = parseCSV(text);
  const hdr = rows[0].map(h => h.trim());
  const col = n => hdr.indexOf(n);
  const C = {
    name: col('Model Name'), cls: col('Instrument'), hand: col('Handedness'), series: col('Series'),
    n: col('Number of Strings'), tuning: col('Tuning Low to High'), gauges: col('String Gauges High to Low'),
    scale: col('Scale Length'), nut: col('Nut Width'), nutMat: col('Nut Material'), bridge: col('Bridge'),
    tailpiece: col('Tailpiece'), tuners: col('Tuners'), zero: col('Zero Fret'),
  };
  const out = [], skipped = [];
  for (const r of rows.slice(1)) {
    const get = k => (C[k] >= 0 ? (r[C[k]] || '').trim() : '');
    const name = get('name');
    if (!name) continue;
    const inst = {
      name, base: baseName(name), cls: get('cls'), hand: get('hand'), series: get('series'),
      nStrings: parseInt(get('n'), 10), tuningRaw: get('tuning'), gaugesRaw: get('gauges'),
      scaleRaw: get('scale'), scale: parseScale(get('scale')), nutWidth: get('nut'), nutMaterial: get('nutMat'),
      bridge: get('bridge'), tailpiece: get('tailpiece'), tuners: get('tuners'), zeroFret: get('zero'),
    };
    const problems = [];
    if (!inst.cls || inst.cls === 'Case') problems.push('not an instrument');
    if (!inst.scale) problems.push('no scale length');
    const courses = parseTuning(inst.tuningRaw);
    if (!courses.length) problems.push('no stock tuning');
    if (problems.length) { skipped.push({ name, problems }); continue; }
    inst.family = familyOf(inst);
    const forceWound = inst.family === 'bass';
    // Gauges are listed high-to-low (string 1 first); tuning low-to-high. Reverse gauges.
    const gCourses = inst.gaugesRaw.split('-').map(c => c.split('/').map(t => parseGauge(t, forceWound)).filter(Boolean)).reverse();
    const nStr = courses.reduce((s, c) => s + c.length, 0);
    if (gCourses.length !== courses.length) { skipped.push({ name, problems: ['gauge count does not match tuning'] }); continue; }
    inst.positions = courses.map((notes, i) => {
      const gs = gCourses[i];
      if (gs.length !== notes.length) problems.push(`course ${courses.length - i}: ${notes.length} notes vs ${gs.length} gauges`);
      return { stock: pairCourse(notes, gs) };
    });
    if (problems.length) { skipped.push({ name, problems }); continue; }
    inst.courseSizes = courses.map(c => c.length);
    inst.totalStrings = nStr;
    out.push(inst);
  }
  return { instruments: out, skipped };
}

// Confirmed tunings document: blocks of [title], [Tuning, 4th String, ...], rows.
function parseConfirmed(text) {
  const rows = parseCSV(text).map(r => r.map(c => c.trim()));
  const out = []; let cur = null;
  for (const r of rows) {
    const nonEmpty = r.filter(Boolean);
    if (!nonEmpty.length) { cur = null; continue; }
    if (/^tuning$/i.test(r[0])) continue;
    if (!cur) { cur = { instrument: r[0], entries: [] }; out.push(cur); continue; }
    const courses = parseTuning(r[0]);
    // gauge columns are listed in the same order as the tuning (lowest course first)
    const gs = r.slice(1).filter(Boolean).map(c => c.split('/').map(t => parseGauge(t)).filter(Boolean));
    if (!courses.length || gs.length !== courses.length) continue;
    cur.entries.push({ raw: r[0], courses: courses.map((n, i) => pairCourse(n, gs[i])) });
  }
  return out;
}

// ---------------------------------------------------------------------------
// Grading helpers
// ---------------------------------------------------------------------------
const RANK = { green: 0, yellow: 1, red: 2 };
const worst = (a, b) => (RANK[a] >= RANK[b] ? a : b);

function stockTensions(inst) {
  const t = [];
  for (const p of inst.positions) for (const s of p.stock) t.push(tension(s.gauge, inst, s.midi));
  return t;
}

// Per-class stock tension range, merged into the family's green band.
function buildClassRanges(instruments, settings) {
  const r = {}, warnings = [], seen = new Set();
  for (const inst of instruments) {
    const key = inst.family + '|' + inst.cls;
    const first = !seen.has(inst.base); seen.add(inst.base);
    for (const p of inst.positions) for (const s of p.stock) {
      const t = tension(s.gauge, inst, s.midi), b = breakIndex(s.midi, inst.scale);
      const why = [];
      if (t > settings.sanityMax[inst.family]) why.push(`${t.toFixed(1)} lb`);
      if (!s.gauge.wound && b > settings.breakYellow) why.push(`plain string at a pitch/scale above the breaking limit`);
      if (why.length) {
        if (first) warnings.push({ instrument: inst.base, note: midiToName(s.midi), gauge: fmtGauge(s.gauge), why: why.join('; ') });
        continue;
      }
      r[key] = r[key] || { lo: Infinity, hi: -Infinity };
      r[key].lo = Math.min(r[key].lo, t); r[key].hi = Math.max(r[key].hi, t);
    }
  }
  r._warnings = warnings;
  return r;
}
function classWindow(inst, settings, classRanges) {
  const w = { ...settings.windows[inst.family] };
  const cr = classRanges && classRanges[inst.family + '|' + inst.cls];
  if (cr) {
    w.greenLo = Math.min(w.greenLo, cr.lo * 0.97); w.greenHi = Math.max(w.greenHi, cr.hi * 1.03);
    w.yellowLo = Math.min(w.yellowLo, w.greenLo * 0.8); w.yellowHi = Math.max(w.yellowHi, w.greenHi * 1.2);
  }
  return w;
}
function gradeTension(t, w) {
  if (t >= w.greenLo && t <= w.greenHi) return 'green';
  if (t >= w.yellowLo && t <= w.yellowHi) return 'yellow';
  return 'red';
}
function breakIndex(midi, scale) { return midiToFreq(midi) * scale; }

// Highest plain-steel f*L in stock specs and confirmed tunings = proven safe.
function provenBreakIndex(instruments, confirmed, settings) {
  const cap = settings ? settings.breakYellow : Infinity;
  let best = { v: 0, what: '' };
  for (const inst of instruments) for (const p of inst.positions) for (const s of p.stock)
    if (!s.gauge.wound) { const v = breakIndex(s.midi, inst.scale); if (v > best.v && v <= cap) best = { v, what: `${inst.base}: ${midiToName(s.midi)} on ${inst.scale}" (stock)` }; }
  for (const blk of confirmed || []) {
    const inst = instruments.find(i => i.name === blk.instrument || i.base === blk.instrument);
    if (!inst) continue;
    for (const e of blk.entries) for (const c of e.courses) for (const s of c)
      if (s.gauge && !s.gauge.wound) { const v = breakIndex(s.midi, inst.scale); if (v > best.v && v <= cap) best = { v, what: `${inst.base}: ${midiToName(s.midi)} on ${inst.scale}" (confirmed tuning)` }; }
  }
  return best;
}

// ---------------------------------------------------------------------------
// Gauge selection
// ---------------------------------------------------------------------------
function candidates(inst, settings) {
  const fam = inst.family;
  const list = [];
  const whole = d => settings.allowHalfGauges || Math.abs(d * 1000 - Math.round(d * 1000)) < 1e-6;
  if (fam !== 'bass') for (const d of AVAILABLE.PL) if (d <= settings.maxPlain && whole(d)) list.push({ d, wound: false });
  const maxW = fam === 'bass' ? settings.maxWoundBass : settings.maxWoundNonBass;
  let woundSet;
  if (fam === 'acoustic') woundSet = AVAILABLE.PB;
  else if (inst.cls === 'Bass') woundSet = AVAILABLE.XLB;
  else if (inst.cls === 'Bass VI') woundSet = [...AVAILABLE.NW.filter(d => d <= 0.080), ...AVAILABLE.XLB.filter(d => d > 0.080)];
  else woundSet = AVAILABLE.NW;
  for (const d of woundSet) if (d >= settings.minWound && d <= maxW + 1e-9) list.push({ d, wound: true });
  return list;
}

function pickGauge(inst, midi, target, settings) {
  const cands = candidates(inst, settings);
  let bestPlain = null, bestWound = null;
  for (const g of cands) {
    const t = tension(g, inst, midi);
    const err = Math.abs(Math.log(t / target));
    const rec = { gauge: g, tension: t, err };
    if (g.wound) { if (!bestWound || err < bestWound.err) bestWound = rec; }
    else { if (!bestPlain || err < bestPlain.err) bestPlain = rec; }
  }
  const pref = settings.plainPreferMax[inst.family];
  let primary, alt = null;
  if (bestPlain && (bestPlain.gauge.d <= pref || !bestWound)) { primary = bestPlain; alt = bestWound; }
  else { primary = bestWound || bestPlain; alt = bestWound ? bestPlain : null; }
  // Heaviest/lightest possible, to explain impossibility.
  const heaviest = cands.reduce((a, g) => (!a || unitWeight(g, inst) > unitWeight(a, inst) ? g : a), null);
  const lightest = cands.reduce((a, g) => (!a || unitWeight(g, inst) < unitWeight(a, inst) ? g : a), null);
  return { primary, alt, heaviest, lightest };
}

// ---------------------------------------------------------------------------
// Main analysis
// ---------------------------------------------------------------------------
// courses: array (lowest course first) of arrays of MIDI notes, same shape as inst.positions.
function analyze(inst, courses, ctx) {
  const settings = ctx.settings, classRanges = ctx.classRanges;
  const w = classWindow(inst, settings, classRanges);
  const stockT = stockTensions(inst);
  const stockTotal = stockT.reduce((a, b) => a + b, 0);
  const target = Math.min(Math.max(stockT.reduce((a, b) => a + b, 0) / stockT.length, w.greenLo), w.greenHi);
  const breakGreen = Math.max(settings.breakGreen, ctx.proven ? ctx.proven.v * 1.005 : 0);
  const breakYellow = Math.max(settings.breakYellow, breakGreen);
  const issues = []; let verdict = 'green';
  const strings = [];
  const n = courses.length;

  if (n !== inst.positions.length) throw new Error('Tuning has ' + n + ' courses; instrument has ' + inst.positions.length);

  courses.forEach((notes, ci) => {
    const stockPairs = inst.positions[ci].stock;
    const sortedNotes = [...notes].sort((a, b) => b - a);
    const stockSorted = [...stockPairs].sort((a, b) => b.midi - a.midi);
    sortedNotes.forEach((midi, si) => {
      const stock = stockSorted[si] || stockSorted[stockSorted.length - 1];
      const pick = pickGauge(inst, midi, target, settings);
      const s = {
        course: n - ci, midi, name: midiToName(midi), freq: midiToFreq(midi),
        stockMidi: stock.midi, stockGauge: stock.gauge, stockTension: tension(stock.gauge, inst, stock.midi),
        gauge: pick.primary.gauge, tension: pick.primary.tension,
        alt: pick.alt && gradeTension(pick.alt.tension, w) !== 'red' ? { gauge: pick.alt.gauge, tension: pick.alt.tension, grade: gradeTension(pick.alt.tension, w) } : null,
        notes: [], grade: 'green',
      };
      s.grade = gradeTension(s.tension, w);
      // Can no allowed gauge reach a usable tension?
      const tMax = tension(pick.heaviest, inst, midi), tMin = tension(pick.lightest, inst, midi);
      if (tMax < w.yellowLo) {
        s.grade = 'red';
        s.notes.push(`Too low: even a ${fmtGauge(pick.heaviest)} only reaches ${tMax.toFixed(1)} lb` +
          (inst.family !== 'bass' ? ' (heavier strings are bass strings and will not fit this hardware)' : ''));
      } else if (tMin > w.yellowHi) {
        s.grade = 'red';
        s.notes.push(`Too high: even a ${fmtGauge(pick.lightest)} is ${tMin.toFixed(1)} lb`);
      } else if (s.grade === 'yellow') {
        s.notes.push(s.tension < w.greenLo ? 'On the slack side' : 'On the tight side');
      } else if (s.grade === 'red') {
        s.notes.push(s.tension < w.greenLo ? 'Too slack' : 'Too tight');
      }
      // Plain-steel breakage (independent of gauge)
      s.breakIdx = breakIndex(midi, inst.scale);
      s.breakPct = s.breakIdx / breakGreen;
      if (!s.gauge.wound) {
        if (s.breakIdx > breakYellow) { s.grade = 'red'; s.notes.push('Plain string will break at this pitch on this scale (any gauge)'); }
        else if (s.breakIdx > breakGreen) { s.grade = worst(s.grade, 'yellow'); s.notes.push('Higher than any plain string Eastwood ships at this pitch/scale: expect breakage'); }
        else if (s.breakIdx > breakGreen * 0.95) s.notes.push('Near the highest pitch/scale Eastwood ships');
      }
      // Nut slot
      const dd = s.gauge.d - stock.gauge.d;
      s.nut = dd >= settings.nutWiden - 1e-9 ? 'widen' : (-dd >= settings.nutLoose - 1e-9 ? 'loose' : null);
      verdict = worst(verdict, s.grade);
      strings.push(s);
    });
  });

  const total = strings.reduce((a, s) => a + s.tension, 0);
  const ratio = total / stockTotal;
  const tw = settings.total[inst.family];
  let totalGrade = ratio <= tw.green ? 'green' : ratio <= tw.yellow ? 'yellow' : 'red';
  if (totalGrade !== 'green') issues.push(`Total tension is ${Math.round((ratio - 1) * 100)}% above stock` +
    (inst.family === 'acoustic' ? ' (acoustic top/bridge load)' : ' (expect a truss rod adjustment)'));
  verdict = worst(verdict, totalGrade);
  const nutCount = strings.filter(s => s.nut).length;

  for (const s of strings) for (const note of s.notes) {
    const line = `${strings.filter(x => x.course === s.course).length > 1 ? 'Course' : 'String'} ${s.course} (${s.name}): ${note}`;
    if (!issues.includes(line)) issues.push(line);
  }

  return {
    inst, strings, verdict, issues, total, stockTotal, ratio, totalGrade, nutCount, window: w, target,
    breakGreen, breakYellow,
  };
}

// Try a tuning on every instrument with the same course layout.
function alternatives(courses, instruments, ctx, excludeBase) {
  const shape = courses.map(c => c.length).join(',');
  const seen = new Set(), out = [];
  for (const inst of instruments) {
    if (inst.base === excludeBase || seen.has(inst.base)) continue;
    if (inst.courseSizes.join(',') !== shape) continue;
    seen.add(inst.base);
    try { out.push(analyze(inst, courses, ctx)); } catch (e) { /* skip */ }
  }
  const score = r => RANK[r.verdict] * 1000 + r.strings.reduce((a, s) => a + RANK[s.grade], 0) * 10 + Math.abs(Math.log(r.ratio));
  return out.sort((a, b) => score(a) - score(b));
}

function findConfirmed(inst, courses, confirmed) {
  const key = cs => cs.map(c => [...c].sort((a, b) => a - b).join('.')).join('|');
  const want = key(courses);
  for (const blk of confirmed) {
    if (blk.instrument !== inst.name && blk.instrument !== inst.base && baseName(blk.instrument) !== inst.base) continue;
    for (const e of blk.entries) if (key(e.courses.map(c => c.map(s => s.midi))) === want) return e;
  }
  return null;
}

function confirmedFor(inst, confirmed) {
  return confirmed.filter(b => b.instrument === inst.name || b.instrument === inst.base || baseName(b.instrument) === inst.base)
    .flatMap(b => b.entries);
}

const api = {
  DEFAULT_SETTINGS, AVAILABLE, setUnitWeights, woundUW, isMeasured, unitWeight, tension,
  noteToMidi, midiToName, midiToFreq, parseNotes, parseTuning, parseGauge, fmtGauge,
  parseCSV, parseSpecs, parseConfirmed, pairCourse, stockTensions, buildClassRanges, classWindow,
  provenBreakIndex, analyze, alternatives, findConfirmed, confirmedFor, breakIndex, baseName, RANK, worst, gradeTension,
};
if (typeof module !== 'undefined' && module.exports) module.exports = api;
else root.Engine = api;
})(this);

<script>
(function(){
'use strict';
const E = window.Engine;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

E.setUnitWeights(BUILTIN.unitWeights);
const settings = JSON.parse(JSON.stringify(E.DEFAULT_SETTINGS));
const { instruments } = E.parseSpecs(BUILTIN.specsCSV);
const confirmed = E.parseConfirmed(BUILTIN.confirmedCSV);
const classRanges = E.buildClassRanges(instruments, settings);
const proven = E.provenBreakIndex(instruments, confirmed, settings);
const ctx = { settings, classRanges, proven };

let inst = null, inputs = [];

// D'Addario ball-end colors by string (course) number
const BALL = { 1:'#a9adb3', 2:'#7b3fa0', 3:'#2e8b3a', 4:'#1a1a1a', 5:'#c62828', 6:'#b5a03a', 7:'#7b3fa0', 8:'#b87333' };
const DARK = new Set([2,3,4,5,7,8]);
const ballColor = n => BALL[n] || '#888';

const dl = $('instList');
for (const i of instruments) { const o = document.createElement('option'); o.value = i.name; dl.appendChild(o); }

$('instInput').addEventListener('input', () => {
  const v = $('instInput').value.trim().toLowerCase();
  const found = instruments.find(i => i.name.toLowerCase() === v);
  if (found && found !== inst) selectInstrument(found);
});

// The tuning exactly as typed (lowest course first, boxes in on-screen order), e.g. "G2-Bb2-D#3-A3"
const typedTuning = () => inst.positions.map((_, ci) =>
  inputs.filter(x => x.course === ci).map(x => x.el.value.replace(/\s+/g, '')).join('')).join('-');
const gaugeStringLH = cg => cg.map(c => c.map(E.fmtGauge).join('/')).join(' - ');

function selectInstrument(i, keepCourses){
  inst = i;
  $('instInput').value = i.name;
  buildStringRows();
  $('tuningPanel').classList.remove('hidden');
  if (keepCourses && keepCourses.length === i.positions.length && keepCourses.every((c,k)=>c.length===i.courseSizes[k])) setCourses(keepCourses);
  else setCourses(i.positions.map(p => p.stock.map(s => s.midi)));
  const all = i.positions.flatMap(p => p.stock.map(s => s.midi));
  scrollPianoTo(Math.round((Math.min(...all) + Math.max(...all)) / 2));
}

function buildStringRows(){
  const box = $('stringRows'); box.innerHTML = ''; inputs = [];
  const n = inst.positions.length;
  // lowest course first (highest string number at the top)
  [...inst.positions.keys()].forEach(ci => {
    const p = inst.positions[ci];
    const stock = [...p.stock].sort((a,b)=>b.midi-a.midi);
    const row = document.createElement('div'); row.className = 'srow';
    row.innerHTML = `<div class="lbl">${p.stock.length > 1 ? 'Course' : 'String'} ${n - ci}<small>stock ${stock.map(s=>E.midiToName(s.midi)).join('/')} · ${stock.map(s=>E.fmtGauge(s.gauge)).join('/')}</small></div>`;
    stock.forEach(() => {
      const el = document.createElement('input'); el.type = 'text'; el.className = 'note'; el.autocomplete = 'off';
      const idx = inputs.length;
      const sn = n - ci;
      el.style.setProperty('--sc', ballColor(sn));
      inputs.push({ el, course: ci, sn });
      el.addEventListener('input', () => {
        // capitalize the note letter as you type (a flat sign stays a lowercase b: Bb2)
        const pos = el.selectionStart;
        const v = el.value.replace(/^\s*([a-g])/, (m, c) => m.replace(c, c.toUpperCase())).replace(/^(\s*[A-G])B/, '$1b');
        if (v !== el.value) { el.value = v; el.setSelectionRange(pos, pos); }
        validate(idx); update();
      });
      el.addEventListener('keydown', ev => {
        if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault(); const m = readMidi(idx);
          if (m != null) { const nm = m + (ev.key === 'ArrowUp' ? 1 : -1); el.value = E.midiToName(nm); validate(idx); update(); play(nm); }
        }
        if (ev.key === 'Enter') inputs[Math.min(idx + 1, inputs.length - 1)].el.focus();
      });
      row.appendChild(el);
    });
    box.appendChild(row);
  });
}
function readMidi(idx){
  const v = inputs[idx].el.value.trim();
  if (!v) return null;
  const notes = E.parseNotes(v);
  return notes.length === 1 && notes[0] != null && notes[0] >= 9 && notes[0] <= 108 ? notes[0] : undefined;
}
function validate(idx){
  const x = inputs[idx], bad = readMidi(idx) === undefined;
  x.el.classList.toggle('bad', bad);
}
function setCourses(courses){
  courses.forEach((c, ci) => {
    const boxes = inputs.filter(x => x.course === ci);   // high-pitch box first within a course
    [...c].sort((a,b)=>b-a).forEach((m, j) => { if (boxes[j]) boxes[j].el.value = E.midiToName(m); });
  });
  inputs.forEach((_,i) => validate(i)); update();
}
function currentCourses(){
  const out = inst.positions.map(() => []);
  for (let k = 0; k < inputs.length; k++) { const m = readMidi(k); if (m == null) return null; out[inputs[k].course].push(m); }
  return out;
}
$('btnStock').onclick = () => setCourses(inst.positions.map(p => p.stock.map(s => s.midi)));
$('btnClear').onclick = () => { inputs.forEach((x,i) => { x.el.value = ''; validate(i); }); inputs[0].el.focus(); update(); };

// ---------- piano ----------
let audio = null;
function play(m){
  if (!$('chkSound').checked) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, f = E.midiToFreq(m);
    const g = audio.createGain(); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    [1,2,3].forEach((h,i) => { const o = audio.createOscillator(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = f * h;
      const gg = audio.createGain(); gg.gain.value = [1,.35,.15][i]; o.connect(gg); gg.connect(g); o.start(t); o.stop(t + 1.5); });
  } catch(e){}
}
function buildPiano(){
  const p = $('piano'); p.innerHTML = ''; let x = 0;
  for (let m = 21; m <= 108; m++) {
    const pc = m % 12, black = [1,3,6,8,10].includes(pc);
    const k = document.createElement('div');
    k.className = black ? 'bk' : 'wk'; k.dataset.m = m;
    k.title = E.midiToName(m) + (black ? ' / ' + E.midiToName(m, true) : '');
    if (black) k.style.left = (x - 8) + 'px';
    else { k.style.left = x + 'px'; k.innerHTML = `<span class="${pc === 0 ? 'c' : ''}">${E.midiToName(m)}</span>`; x += 24; }
    k.addEventListener('mousedown', ev => { ev.preventDefault(); pianoClick(m); });
    p.appendChild(k);
  }
  p.style.width = x + 'px';
}
function pianoClick(m){ play(m); }   // reference only: never changes the tuning boxes
function paintPiano(){
  const on = new Map();
  inputs.forEach((x,i) => { const m = readMidi(i); if (m != null) { const l = on.get(m) || []; if (!l.includes(x.sn)) l.push(x.sn); on.set(m, l); } });
  document.querySelectorAll('#piano [data-m]').forEach(k => {
    const m = +k.dataset.m, sns = on.get(m);
    k.classList.toggle('on', !!sns);
    const span = k.querySelector('span');
    if (!sns) { k.style.background = ''; k.classList.remove('dark'); if (span) span.classList.remove('light'); return; }
    // one color per string on this pitch; shared pitches get side-by-side stripes
    const cols = sns.sort((a,b)=>a-b).map(ballColor);
    k.style.background = cols.length === 1 ? cols[0] :
      'linear-gradient(to right,' + cols.map((c,i) => `${c} ${100*i/cols.length}%,${c} ${100*(i+1)/cols.length}%`).join(',') + ')';
    const dark = sns.every(n => DARK.has(n));
    k.classList.toggle('dark', sns.includes(4));
    if (span) span.classList.toggle('light', dark);
  });
}
function scrollPianoTo(midi){
  const k = document.querySelector(`#piano [data-m="${midi}"]`), w = $('pianoWrap');
  if (k) w.scrollLeft = Math.max(0, parseFloat(k.style.left) - w.clientWidth / 2);
}

// ---------- results ----------
const VERDICT = { green: 'Possible', yellow: 'Possible, with caveats', red: 'Not recommended on this instrument' };

// strings grouped by course: string 1 first, high pitch first within a course
function groups(r){
  const by = {};
  r.strings.forEach(s => (by[s.course] = by[s.course] || []).push(s));
  return Object.keys(by).map(Number).sort((a,b) => a - b).map(c => by[c].sort((a,b) => b.midi - a.midi));
}
function checks(r){
  const out = [...r.issues];
  if (r.verdict === 'red') return out;
  const widen = r.strings.filter(s => s.nut === 'widen').map(s => s.name);
  const loose = r.strings.filter(s => s.nut === 'loose').map(s => s.name);
  if (widen.length) out.push(`Nut slots likely need widening for: ${[...new Set(widen)].join(', ')}`);
  if (loose.length) out.push(`Nut slots may be loose for: ${[...new Set(loose)].join(', ')}`);
  return out;
}

function update(){
  paintPiano();
  if (!inst) return;
  const courses = currentCourses();
  $('resultPanel').classList.remove('hidden');
  if (!courses) { $('result').innerHTML = `<div class="mini">Enter all ${inst.totalStrings} notes to see the result.</div>`; $('altPanel').classList.add('hidden'); return; }
  let r;
  try { r = E.analyze(inst, courses, ctx); } catch(e) { $('result').textContent = 'Error: ' + e.message; return; }

  let h = `<div class="verdict ${r.verdict}">${VERDICT[r.verdict]}<small>${esc(inst.name)} · ${esc(typedTuning())}</small></div>`;
  const conf = E.findConfirmed(inst, courses, confirmed);
  if (conf) h += `<div class="confirmed"><b>✔ In the Confirmed Tunings doc (low to high):</b> ${esc(gaugeStringLH(conf.courses.map(c => [...c].sort((a,b)=>b.midi-a.midi).map(s => s.gauge))))}</div>`;
  if (r.verdict !== 'red') {
    const gs = [...groups(r)].reverse().map(g => g.map(s => `<span class="gc" title="${s.name}: ${s.tension.toFixed(1)} lb">${E.fmtGauge(s.gauge)}</span>`).join('/')).join('<span class="sep">-</span>');
    h += `<div class="mini">Suggested gauges (low to high)</div><div class="gauges">${gs}</div>`;
  }
  const c = checks(r);
  if (c.length) h += `<div class="check"><ul>${c.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  $('result').innerHTML = h;

  if (r.verdict !== 'green') {
    const alts = E.alternatives(courses, instruments, ctx, inst.base).filter(a => a.verdict !== 'red').slice(0, 10);
    $('altPanel').classList.remove('hidden');
    $('alts').innerHTML = alts.length ? renderAlts(alts) : '<div>No other instrument in the database handles this tuning without problems.</div>';
    $('alts').querySelectorAll('[data-alt]').forEach(a => a.addEventListener('click', () => {
      const typed = inputs.map(x => x.el.value);           // same string layout, so carry the spelling over
      selectInstrument(instruments.find(i => i.name === a.dataset.alt), courses);
      if (typed.length === inputs.length) { inputs.forEach((x, k) => { x.el.value = typed[k]; validate(k); }); update(); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }));
  } else $('altPanel').classList.add('hidden');
}

function renderAlts(list){
  let h = `<table><thead><tr><th>Instrument</th><th>Scale</th><th>Result</th><th>Suggested gauges (low to high)</th></tr></thead><tbody>`;
  for (const a of list) {
    const g = [...groups(a)].reverse().map(c => c.map(s => E.fmtGauge(s.gauge)).join('/')).join(' - ');
    h += `<tr><td><a class="link" data-alt="${esc(a.inst.name)}">${esc(a.inst.base)}</a></td><td>${a.inst.scale}"</td>
      <td class="${a.verdict === 'green' ? 'g' : 'y'}">${VERDICT[a.verdict]}</td><td>${g}</td></tr>`;
  }
  return h + '</tbody></table>';
}

buildPiano();
})();
</script>
